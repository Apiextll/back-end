services:
  postgres:
    image: postgres:16-alpine
    container_name: competype-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-competype}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - competype_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-competype}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - competype-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: competype-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-competype}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_PROFILES_ACTIVE: default
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - competype-network

volumes:
  competype_pgdata:
    name: competype_pgdata

networks:
  competype-network:
    name: competype-network
