spring.application.name=competype-test

# Test Database Configuration (H2 in PostgreSQL mode)
spring.datasource.url=jdbc:h2:mem:competypetest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate for Test
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway disabled in test context (H2 handles DDL create-drop directly)
spring.flyway.enabled=false
